<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="生日提醒中心">
  <defs>
    <linearGradient id="bd-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37a3a1" />
      <stop offset="1" stop-color="#1e666e" />
    </linearGradient>
    <linearGradient id="bd-flame" x1="32" y1="7.5" x2="32" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7c250" />
      <stop offset="1" stop-color="#e15d3e" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bd-bg)" />

  <!-- 烛焰：呼应主题里的暖橙 accent -->
  <path d="M32 7.5c3.4 3.4 5.2 6 5.2 8.4a5.2 5.2 0 1 1-10.4 0c0-2.4 1.8-5 5.2-8.4Z" fill="url(#bd-flame)" />
  <!-- 蜡烛：底部被蛋糕遮住，形成插入感 -->
  <rect x="30.1" y="17" width="3.8" height="17" rx="1.9" fill="#fdf6ec" />
  <!-- 蛋糕主体 -->
  <path d="M17.5 32h29a4.5 4.5 0 0 1 4.5 4.5V48a3.5 3.5 0 0 1-3.5 3.5h-31A3.5 3.5 0 0 1 13 48V36.5A4.5 4.5 0 0 1 17.5 32Z" fill="#ffffff" />
  <!-- 糖霜分界线 -->
  <path d="M13 41h38" stroke="#2e8c8c" stroke-opacity="0.22" stroke-width="2.4" />
  <!-- 糖粒：刻意不对称并交替倾斜，避免两点一线被读成一张脸 -->
  <g stroke-width="1.9" stroke-linecap="round">
    <path d="M18.8 37.7 20.5 34.2" stroke="#e15d3e" />
    <path d="M26.4 34.4 25.1 38" stroke="#d99a2b" />
    <path d="M38.2 34.8 39.7 38.2" stroke="#d99a2b" />
    <path d="M45.4 37.6 46.9 34.1" stroke="#e15d3e" />
  </g>
  <!-- 托盘 -->
  <rect x="9.5" y="52.6" width="45" height="3.6" rx="1.8" fill="#ffffff" fill-opacity="0.5" />
</svg>
