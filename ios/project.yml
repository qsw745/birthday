name: BirthdayMobile
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BirthdayCore:
    path: BirthdayCore
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: top.qisw.birthday
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  BirthdayMobile:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    sources:
      - BirthdayMobile
    info:
      path: BirthdayMobile/Info.plist
      properties:
        CFBundleDisplayName: 岁时
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: 使用 Face ID 保护生日资料
        BGTaskSchedulerPermittedIdentifiers:
          - top.qisw.birthday.refresh
    dependencies:
      - package: BirthdayCore
  BirthdayMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BirthdayMobileUITests
    dependencies:
      - target: BirthdayMobile
