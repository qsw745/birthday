name: BirthdayMobile
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BirthdayCore:
    path: BirthdayCore
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: top.qisw.birthday
    ICLOUD_CONTAINER_IDENTIFIER: iCloud.top.qisw.birthday
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BirthdayMobile:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BirthdayMobile/Config/BirthdayMobile.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
    configFiles:
      Debug: BirthdayMobile/Config/Debug.xcconfig
      Release: BirthdayMobile/Config/Release.xcconfig
    sources:
      - path: BirthdayMobile
        excludes:
          - PrivacyInfo.xcprivacy
      - path: BirthdayMobile/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: BirthdayMobile/Info.plist
      properties:
        CFBundleDisplayName: 岁时
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BirthdayAPIBaseURL: "$(BIRTHDAY_API_BASE_URL)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: 使用 Face ID 保护生日资料
    dependencies:
      - package: BirthdayCore
  BirthdayMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BirthdayMobile/Config/BirthdayMac.entitlements
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: top.qisw.birthday
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    configFiles:
      Debug: BirthdayMobile/Config/Debug.xcconfig
      Release: BirthdayMobile/Config/Release.xcconfig
    sources:
      - path: BirthdayMobile
        excludes:
          - PrivacyInfo.xcprivacy
      - path: BirthdayMobile/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: BirthdayMobile/MacInfo.plist
      properties:
        CFBundleDisplayName: 岁时
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BirthdayAPIBaseURL: "$(BIRTHDAY_API_BASE_URL)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: 使用生物识别保护生日资料
    dependencies:
      - package: BirthdayCore
  BirthdayMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - BirthdayMobileUITests
    dependencies:
      - target: BirthdayMobile
  BirthdayMacUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations:
      - macCatalyst
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: BirthdayMobileUITests
        includes:
          - ICloudAndMacFlowUITests.swift
    dependencies:
      - target: BirthdayMac
  BirthdayMobileTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - BirthdayMobileTests
    dependencies:
      - target: BirthdayMobile
