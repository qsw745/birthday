name: BirthdayMobile
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BirthdayCore:
    path: BirthdayCore
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: top.qisw.birthday
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BirthdayMobile:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    configFiles:
      Debug: BirthdayMobile/Config/Debug.xcconfig
      Release: BirthdayMobile/Config/Release.xcconfig
    sources:
      - path: BirthdayMobile
        excludes:
          - PrivacyInfo.xcprivacy
      - path: BirthdayMobile/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: BirthdayMobile/Info.plist
      properties:
        CFBundleDisplayName: 岁时
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BirthdayAPIBaseURL: "$(BIRTHDAY_API_BASE_URL)"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: 使用 Face ID 保护生日资料
        BGTaskSchedulerPermittedIdentifiers:
          - top.qisw.birthday.refresh
        UIBackgroundModes:
          - fetch
    dependencies:
      - package: BirthdayCore
  BirthdayMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - BirthdayMobileUITests
    dependencies:
      - target: BirthdayMobile
  BirthdayMobileTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - BirthdayMobileTests
    dependencies:
      - target: BirthdayMobile
